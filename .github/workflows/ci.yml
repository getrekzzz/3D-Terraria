name: CI

# This repo is private, so every job draws on the account's free Actions minutes (2,000 a month,
# reset on the 1st; Windows minutes cost double). When they run out, every job fails within seconds
# without a runner. Where each check runs, with rough billed minutes:
#   pull request (any base), draft          -> Core tests (ubuntu-latest)                          ~10 per push
#   pull request (any base), ready          -> + Godot smoke test                                  ~25 per push
#   push to main                            -> Core tests (ubuntu + windows) + Godot smoke test    ~50 per push
#   1st of each month                       -> everything, including the Screenshot tour          ~150
#   Run workflow (Actions tab, any branch)  -> Core tests (ubuntu + windows) + Godot smoke test; tick the box for the tour
# Keep PRs as drafts while iterating and mark them ready when you want the smoke test. Pushes to
# branches without a PR, and PRs touching only docs, run nothing. Ready PRs that touch world
# generation or content also get the Windows determinism check in windows-pr.yml.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  schedule:
    - cron: '23 4 1 * *' # 04:23 UTC on the 1st of each month, on the default branch
  workflow_dispatch:
    inputs:
      screenshot_tour:
        description: Also run the Screenshot tour (about two hours, over 100 billed minutes)
        type: boolean
        default: false

# A new push to a PR cancels the run it replaces. Every other run has a group of its own.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  GODOT_VERSION: 4.7.2

jobs:
  core:
    name: Core tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Module size guard
        run: python3 tools/ci/check_file_length.py
      - name: Build
        run: dotnet build Strata.sln -c Debug
      - name: Test
        run: dotnet test tests/Strata.Core.Tests/Strata.Core.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"
      - name: Content up to date (manifest + generated tiers)
        run: |
          python3 tools/content/gen_ore_tiers.py --check
          python3 tools/content/gen_furniture.py --check
          python3 tools/content/gen_banners.py --check
          dotnet run --project tools/Strata.Tools -c Debug --no-build -- manifest --check
      - name: Validate content
        run: dotnet run --project tools/Strata.Tools -c Debug --no-build -- validate
      - name: Reference databases and asset coverage
        run: |
          python3 tools/content/gen_reference.py --check
          python3 tools/blender/build_all.py --check
          python3 tools/textures/build_ui.py --check
          python3 tools/textures/icon_mipmaps.py --check
          dotnet run --project tools/Strata.Tools -c Debug --no-build -- coverage | tee coverage.md >> "$GITHUB_STEP_SUMMARY"

  # Cross-OS determinism (golden chunk hashes) and line endings. Its own job, so a Windows-only
  # failure doesn't skip the smoke test or the tour.
  core-windows:
    name: Core tests (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build Strata.sln -c Debug
      - name: Test
        run: dotnet test tests/Strata.Core.Tests/Strata.Core.Tests.csproj -c Debug --no-build --logger "console;verbosity=normal"

  engine-smoke:
    name: Godot smoke test
    runs-on: ubuntu-latest
    needs: core
    # Draft PRs get Core tests only; marking a PR ready runs this.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux
      - name: Get Godot
        run: echo "GODOT=$(bash tools/ci/get-godot.sh ~/godot)" >> "$GITHUB_ENV"
      - name: Build game assembly
        run: dotnet build Strata.csproj -c Debug
      - name: Import project
        run: timeout 900 "$GODOT" --headless --path . --import
      - name: Run smoke scripts
        run: |
          set -o pipefail
          for script in game/Testing/Scripts/*.cmds; do
            name=$(basename "$script" .cmds)
            echo "::group::$name"
            timeout 600 "$GODOT" --headless --path . --audio-driver Dummy -- \
              --world=smoke-$name --size=tiny --new --player=smoke --fresh-player --view=2 \
              --smoke=res://$script 2>&1 | tee "smoke-$name.log"
            grep -q "SMOKE PASS" "smoke-$name.log"
            echo "::endgroup::"
          done
      - name: Menu tour (title → create character and world → settings → play → pause → exit)
        run: |
          set -o pipefail
          timeout 600 "$GODOT" --headless --path . --audio-driver Dummy -- --menu-tour 2>&1 | tee smoke-menu.log
          grep -q "MENU PASS" smoke-menu.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: smoke-*.log
          retention-days: 7

  screenshot-tour:
    name: Screenshot tour
    runs-on: ubuntu-latest
    needs: engine-smoke
    # Software rendering is slow (well over an hour): monthly, and on demand when ticked.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.screenshot_tour)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux
      - name: Get Godot
        run: echo "GODOT=$(bash tools/ci/get-godot.sh ~/godot)" >> "$GITHUB_ENV"
      - name: Software Vulkan and virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1
      - name: Build game assembly
        run: dotnet build Strata.csproj -c Debug
      - name: Import project
        run: timeout 900 "$GODOT" --headless --path . --import
      - name: Tour
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          timeout 5400 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1280x720 -- --world=tour --size=small --new --player=tour \
            --fresh-player --view=3 --graphics=medium --shots="$PWD/shots" --smoke=res://game/Testing/Tours/tour.cmds 2>&1 | tee tour.log
          grep -q "SMOKE PASS" tour.log
          ls -l shots
      - name: UI tour
        run: |
          set -o pipefail
          export VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          timeout 3600 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path . --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1280x720 -- --world=ui-tour --size=tiny --new --player=tour \
            --fresh-player --view=2 --graphics=medium --shots="$PWD/ui-shots" --smoke=res://game/Testing/Tours/ui.cmds 2>&1 | tee ui-tour.log
          grep -q "SMOKE PASS" ui-tour.log
          ls -l ui-shots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-tour
          retention-days: 14
          path: |
            shots/*.png
            tour.log
            ui-shots/*.png
            ui-tour.log
